# Дневная проверка механизма: 1 отчёт × 2 прогона, ~15 минут.
# Каждый [[job]] — одно задание. Порядок в файле = приоритет.
#
# model        ключ модели из `lms ls`
# spec         версия спецификации: specs/{spec}.md + specs/{spec}.prompt.md
# reports      id отчётов из text/
# runs         сколько повторов
# temperature  0 — боевой режим (ответы одинаковые), 0.7 — стресс (ищем двусмысленности)
# think        true — модель сначала размышляет (дольше, без строгого JSON)
# ctx          сколько текста модель держит в памяти за раз, в токенах

[[job]]
model = "qwen3.8-27b-mlx@4bit"
spec = "v1_baseline"
reports = ["2026_q2"]
runs = 2
temperature = 0
ctx = 24576   # отчёт ~14–16 тыс. токенов + ответ ~2,5 тыс. (замер 2026-09-14)
