# H6b: цена сжатия. Та же модель, тот же движок MLX, 5 бит вместо 4.
# Запускается ТОЛЬКО когда в окне LM Studio источник модели переключён на MLX 5bit: раннер проверяет вариант
# и остановится с ошибкой, если переключения не было (перепутать веса нельзя).
# 13:40: при контексте 32768 пятибитная версия требует 25,4 ГиБ — больше нашего предела 24, не влезла.
# Снижен до 20480: запрос ~14 тыс. токенов плюс ответ ~3,4 тыс. помещаются. Это тоже замер: более точные
# веса стоят памяти, и на 32 ГБ выбор «точность против длины контекста» становится жёстким.
# ПРЕДСКАЗАНИЕ (21.09 14:10, до прогона): устойчивость в пределах шума (альфа ±0,02), выдуманных цитат меньше
# на треть и больше — если сжатие и правда портит воспроизведение цифр, это видно именно на цитатах.
[[job]]
model = "qwen3.8-27b-mlx@5bit"
spec = "v7_extract"
reports = ["2022_q4", "2026_q2", "2024_q3", "2023_q4"]
runs = 5
temperature = 0.7
min_p = 0.05
mode = "extract2"
text = "v2"
ctx = 20480
