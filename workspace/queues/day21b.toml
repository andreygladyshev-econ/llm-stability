# 18:05 порядок переставлен: до 22:00 успеет ~40 прогонов, вперёд — самое ценное: Яндекс (третья семья),
# боевой режим с перемешанным порядком, температура 0,3 до 10 прогонов. Остальное — если останется время.
# День 21.09 (переписана в 11:55 после диагностики).
# НАХОДКА: движок llama.cpp (GGUF) не выдерживает нашу строгую JSON-схему — сервер выгружает модель прямо во
# время запроса («Model is unloaded», 400). Тот же запрос без схемы проходит. MLX схему держит.
# Значит, честное сравнение движков возможно только в режиме БЕЗ схемы, и это делается парой: GGUF и MLX.
#
# Порядок: сначала то, что даёт чистый ответ (сжатие), потом перенос во времени, потом пара «движок».
# 13:30 СНЯТО: сравнение движков и сжатий на этой машине недоступно. Командная строка LM Studio не грузит
# неосновные варианты карточки («Model not found»), а сервер поднимает их только с контекстом 8192 — нашему
# промпту (около 14 тысяч токенов) этого мало, отсюда 400. Вывод записан в ночь_9.md.
# Прежнее предсказание (11:55), оставлено для истории: 5 бит против 4 бит — разница в пределах шума по устойчивости, цитат чуть больше
# подтверждается; без схемы обе версии теряют разбор ответов (ждём 5–15% нечитаемых JSON).

# H6b: та же модель, то же ядро, больше бит
[[job]]
model = "yandexgpt-5-lite-8b-instruct"
spec = "v7_extract"
reports = ["2022_q4", "2026_q2", "2024_q3", "2023_q4"]
runs = 3
temperature = 0.7
min_p = 0.05
mode = "extract2"
