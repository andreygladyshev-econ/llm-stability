# День 22.09 — последняя содержательная проверка перед заморозкой.
#
# v10 = v7 + решения Андрея 21.09 из реестра спорных мест (`_АНДРЕЙ/2_план_и_гипотезы/СПОРНЫЕ_МЕСТА_СПЕКИ.md`):
#   один период без оговорок о его части · название показателя читается буквально (подсегмент не подменяет целое) ·
#   закрытая таблица оценочных фраз · пороги силы для качества портфеля · внешние условия год к году за весь
#   период · тональность по всей прямой речи председателя.
# Режим — боевой: T=0, пять перестановок порядка показателей (как у v7 ночью), итог по большинству.
# ПРЕДСКАЗАНИЕ (22.09 09:30, до прогона):
#   1. на эталоне v10 исправляет две клетки 2026_q2 (тональность +1→+2, средства клиентов +1→0): мода пяти
#      перестановок совпадает с эталоном не хуже 47/48 (у v7 — 46/48);
#   2. хрупких клеток не больше, чем у v7 (Сбер в среднем 1,3 на отчёт при трёх перестановках);
#   3. если хрупких станет больше — длинная спека размывает внимание, и замораживаем v7.
[[job]]
model = "qwen3.8-27b-mlx@4bit"
spec = "v10_extract"
reports = ["2022_q4", "2026_q2", "2024_q3", "2023_q4"]
runs = 5
temperature = 0
ids_order = "shuffled"
mode = "extract2"
text = "v2"
ctx = 32768

[[job]]
model = "qwen3.8-27b-mlx@4bit"
spec = "v10_extract"
reports = ["2023_q1", "2023_q3", "2024_q1", "2024_q2", "2025_q1", "2025_q2", "2025_q4", "2026_q1"]
runs = 3
temperature = 0
ids_order = "shuffled"
mode = "extract2"
text = "v2"
ctx = 32768

# добор разложения разброса до трёх полных порядков (ночью оборвалось в 08:00 на 17 из 24)
# ══════ Разложение разброса: повтор × порядок (по 2608.16253, «Second-Order Response Laws») ══════
# Три фиксированных порядка показателей, по 2 повтора каждый при T=0,7. Вместе с 16 прогонами в исходном порядке
# это даёт несмещённое разложение: случайность вызова / порядок / взаимодействие — по каждой клетке.
# Зачем для записки: главная находка («ломаются одни и те же клетки») получает количественную форму —
# какая доля разброса от сэмплирования, какая от порядка, и одни ли это клетки.
# ПРЕДСКАЗАНИЕ (23:20): доля «случайности вызова» больше доли «порядка» (у Qwen в статье так же: .19 против .05).

[[job]]
model = "qwen3.8-27b-mlx@4bit"
spec = "v7_extract"
reports = ["2022_q4", "2026_q2", "2024_q3", "2023_q4"]
runs = 2
temperature = 0.7
min_p = 0.05
ids_order = "shuffled"
order_seed = 1
tag = "o1"
mode = "extract2"
text = "v2"
ctx = 32768

