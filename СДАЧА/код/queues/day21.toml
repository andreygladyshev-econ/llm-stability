# День 21.09. Итог ночи: v9 не подтвердилась (плавающих 8 против 6 у v7) — рабочей остаётся v7.
# Устойчивость v8 была куплена выдумками: убрали требование «заполни обе ячейки» — ушли и выдумки, и выигрыш.
# Gemma на v7 оборвалась по контексту (3 обрыва): схема с двумя ячейками длиннее, 20480 не хватает.
#
# Этот стек отвечает на вопрос переносимости — самый важный для заказчика:
# H11  тот же вес, другой движок: MLX 4 бита против GGUF 4 бита;
# H6b  та же модель, другое сжатие: 4 / 5 / 6 бит;
# H34+N5 боевой режим T=0: перемешанный порядок показателей — устойчивость к возмущению, а не к сэмплированию;
# Gemma на v7 с увеличенным контекстом — вторая семья на лучшем конвейере (правило приёмки правок).
# ПРЕДСКАЗАНИЕ (21.09 09:00): движок (MLX против GGUF при одном сжатии) даёт различие в пределах шума ±0,02
# альфы; сжатие 4→6 бит даёт заметное улучшение цитат; перемешанный порядок при T=0 меняет 1–3 клетки из 24.

[[job]]
model = "qwen3.8-27b-gguf@q4km"
spec = "v7_extract"
reports = ["2022_q4", "2026_q2", "2024_q3", "2023_q4"]
runs = 5
temperature = 0.7
min_p = 0.05
mode = "extract2"
text = "v2"
ctx = 32768

