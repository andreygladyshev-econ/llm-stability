# DeepSeek V4.1 Flash, размышление HIGH — третья точка кривой «выкл → low → high» (Андрей 23.09: «нормальный уровень
# размышлений можно, деньги есть»). На уровне high размышление 18–24 тыс. токенов, при лимите 24000 два ответа из трёх
# обрезались — здесь лимит 48000. Отдельный процесс параллельно основной цепочке: 5–7 мин на запрос, ~4 ч, ~$0,7.
[[job]]
model = "deepseek/deepseek-v4.1-flash"
spec = "v7_extract"
reports = ["2026_q2"]
runs = 5
temperature = 0
tag = "det-think-high"
mode = "extract2"
text = "v2"
ctx = 32768
budget = 1.5
seed = 1
reasoning_effort = "high"
max_tokens = 48000

