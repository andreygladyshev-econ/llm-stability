# Ночь 1 (2026-09-14 → 15).
# Отладочные отчёты: 2022_q4 (кризис), 2023_q4 (годовой), 2024_q3 (средний), 2026_q2 (сильный).
# Холдаут (не трогаем до конца): 2023_q2, 2024_q4, 2025_q3.
# Замер 2026-09-14: Qwen MLX 4bit без размышления ≈ 5 мин на прогон.

# 1. Главный замер: где исходная спека допускает два прочтения.
#    Температура 0.7 — модель «колеблется» там, где правило двусмысленное.  20 прогонов ≈ 1,7 ч
[[job]]
model = "qwen3.8-27b-mlx@4bit"
spec = "v1_baseline"
reports = ["2022_q4", "2026_q2", "2024_q3", "2023_q4"]
runs = 5
temperature = 0.7
ctx = 32768

# 2. Боевой режим: температура 0, по 2 прогона — проверяем, что на длинных отчётах
#    ответы тоже совпадают побайтово.  8 прогонов ≈ 0,7 ч
[[job]]
model = "qwen3.8-27b-mlx@4bit"
spec = "v1_baseline"
reports = ["2022_q4", "2026_q2", "2024_q3", "2023_q4"]
runs = 2
temperature = 0
ctx = 32768

# 2б. Контроль для гипотезы H1: те же условия, но модель НЕ перезагружается между прогонами —
#     кэш промпта разрешён. Сравнение с заданием 2 покажет, сколько расхождений даёт сама
#     «инфраструктура», а не формулировки спеки.  6 прогонов ≈ 0,4 ч (тёплые прогоны быстрее)
[[job]]
model = "qwen3.8-27b-mlx@4bit"
spec = "v1_baseline"
reports = ["2022_q4", "2026_q2"]
runs = 3
temperature = 0
fresh_load = false
ctx = 32768

# 3. Режим размышления ИСКЛЮЧЁН: smoke-тест на 2 страницах — 20 минут, 16 000 токенов черновика,
#    ответ обрезан, JSON нет. Нужен отдельный подход (лимит размышления), не на эту ночь.

# 4. Другое семейство моделей: те же 4 отчёта. В память влезает только с контекстом 20480.  20 прогонов ≈ 2 ч
[[job]]
model = "google/gemma-4-31b-qat"
spec = "v1_baseline"
reports = ["2022_q4", "2026_q2", "2024_q3", "2023_q4"]
runs = 5
temperature = 0.7
ctx = 20480

# 4б. Российская модель: T-pro-it-2.1 (Т-Банк, дообученный на русском Qwen3-32B). Влезает: 21,6 GiB при 20480.
#     Меньше повторов, чем у остальных: 32B медленнее, в smoke не проверялась.  12 прогонов ≈ 1,5–2 ч
[[job]]
model = "t-pro-it-2.1"
spec = "v1_baseline"
reports = ["2022_q4", "2026_q2", "2024_q3", "2023_q4"]
runs = 3
temperature = 0.7
ctx = 20480

# 5. Квантизация (H6): та же архитектура Qwen, сжатая до 2 бит (Bonsai). Сравнение с заданием 1.
#    В smoke-тесте не проверялась — если ответы непригодны 3 раза подряд, раннер модель пропустит.  20 прогонов ≈ 1–1,5 ч
[[job]]
model = "prism-ml/bonsai-27b"
spec = "v1_baseline"
reports = ["2022_q4", "2026_q2", "2024_q3", "2023_q4"]
runs = 5
temperature = 0.7
ctx = 32768
