# Ночь 4 (17.09 ~19:30 → 18.09 09:50). Решения по итогам ночи 3 и обзора литературы:
#   _АНДРЕЙ/1_ночи/ночь_3.md, _АНДРЕЙ/3_знания/литература.md.
# База сравнения — v2_inplace (T=0.7, 4 отладочных отчёта). Меняется ровно один фактор за раз.
# Критерий приёмки (заранее, протокол _АНДРЕЙ/3_знания/протокол_универсальности.md): лучше базы в 3 из 4 отчётов,
# без лишних переворотов знака, прирост «единогласно» ≥ 5 п.п. на одинаковом числе прогонов.
# Изменение формы принимается окончательно, только если не проигрывает и на второй модели (Gemma).
# Очередь перечитывается перед каждым прогоном — сюда можно дописывать задания посреди ночи.
# Qwen ≈ 5,2 мин/прогон (с загрузкой), «два хода» ≈ 8 мин, Gemma ≈ 10 мин.

# ═══ 1. Добор решений ═══════════════════════════════════════════════════════════

# 1.1 «Отчёт первым» до 5 прогонов (1–3 есть): решить по строгому замеру.                    8 ≈ 0,7 ч
[[job]]
model = "qwen3.8-27b-mlx@4bit"
spec = "v2_inplace"
reports = ["2022_q4", "2026_q2", "2024_q3", "2023_q4"]
runs = 5
temperature = 0.7
order = "report_first"
ctx = 32768

# 1.2 v4 = v2_inplace без примеров (на v2_all удаление примеров дало +5 п.п.). Сразу 5 прогонов. 20 ≈ 1,8 ч
[[job]]
model = "qwen3.8-27b-mlx@4bit"
spec = "v4"
reports = ["2022_q4", "2026_q2", "2024_q3", "2023_q4"]
runs = 5
temperature = 0.7
ctx = 32768

