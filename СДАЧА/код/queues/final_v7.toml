# ФИНАЛЬНЫЙ ЛОКАЛЬНЫЙ ПРОХОД — конвейер v7_extract заморожен (решение вечером 22.09 по итогам queues/day22.toml).
# Холдаут (2023_q2, 2024_q4, 2025_q3) открывается ЗДЕСЬ, один раз. После — никаких правок спеки и кода.
# Боевой режим: T=0, пять перестановок порядка показателей, итог по большинству, расхождения — флажок человеку.
# Столбец «устойчивость при сэмплировании» для таблицы задания: T=0,7 по 5 прогонов.
# ПРЕДСКАЗАНИЕ (22.09, до прогона): на холдауте хрупких клеток не больше 2 на отчёт в боевом режиме,
# альфа при T=0,7 не ниже 0,92 (как у нетронутых кварталов). Если хуже — это признак подгонки, пишем как есть.

[[job]]
model = "qwen3.8-27b-mlx@4bit"
spec = "v7_extract"
reports = ["2023_q2", "2024_q4", "2025_q3"]
runs = 5
temperature = 0
ids_order = "shuffled"
mode = "extract2"
text = "v2"
ctx = 32768

