# ОБЛАКО — список утверждён Андреем 22.09.2026. Порядок заданий = порядок запуска.
# Запуск ТОЛЬКО по команде Андрея и ПО ОДНОЙ МОДЕЛИ:  .venv/bin/python src/cloud.py run queues/cloud.toml --only <модель>
# После каждой модели — разбор (src/cloud_report.py): деньги против прогноза, разбор ответов, провайдер, детерминизм.
# Спека v7 (заморожена; v10 не проверена — дневной замер остановлен).
# Защита: лимит ключа $20 · общий стоп $18 · бюджет модели · худший запрос проверяется до отправки · logs/cloud.STOP.
