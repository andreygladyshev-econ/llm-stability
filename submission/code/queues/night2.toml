# ── Блок B: боевой режим T=0 для трёх главных вариантов ─────────────────────────────
# При T=0 с перезагрузкой прогоны побайтово одинаковы (ночь 1) → 1 прогон достаточно.
# Это ответ, который идёт в финальную таблицу; сверяется с ручной разметкой и с v1 t0.
[[job]]
