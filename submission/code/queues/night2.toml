# Ночь 2 (и хвост в ночь 3): что даёт содержание правок и что — форма их записи.
# Qwen3.8-27B MLX 4bit. Стресс-ячейка: 4 отладочных отчёта × 3 прогона, T=0.7 ≈ 1 ч на вариант.
# Порядок = приоритет для завтрашнего решения о v3. Что не успеет — дозапуск той же командой, готовое пропускается.
# База для сравнения (не перегоняется): v1_baseline t0.7 run1–3 и v1_baseline t0 из ночи 1.
# Содержание у всех вариантов, кроме одиночных, одно — 8 модулей из specs/modules_v2.md.

# ── Блок A: содержание правок (нужно для решения о v3) ──────────────────────────────

# A1. Все правки, дописаны в конец v1
[[job]]
model = "qwen3.8-27b-mlx@4bit"
spec = "v2_all"
reports = ["2022_q4", "2026_q2", "2024_q3", "2023_q4"]
runs = 3
temperature = 0.7
ctx = 32768

# A2. Те же правки вписаны внутрь текста, противоречия v1 убраны
[[job]]
model = "qwen3.8-27b-mlx@4bit"
spec = "v2_inplace"
reports = ["2022_q4", "2026_q2", "2024_q3", "2023_q4"]
runs = 3
temperature = 0.7
ctx = 32768

# A3. Короткая версия: только правила и таблица (в 4 раза короче v2_all)
[[job]]
model = "qwen3.8-27b-mlx@4bit"
spec = "v2_compact"
reports = ["2022_q4", "2026_q2", "2024_q3", "2023_q4"]
runs = 3
temperature = 0.7
ctx = 32768

# A4–A6. Одиночные модули, давшие перевороты знака в ночь 1 — вклад каждой правки
[[job]]
model = "qwen3.8-27b-mlx@4bit"
