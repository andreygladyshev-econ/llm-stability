# Ночь 20→21.09. Итог дня: v8 устойчивее v7 (плавающих клеток 4 против 7, смен знака 1 против 4),
# НО цитаты хуже: подтверждено 81,2% против 89,9%, выдумано 11,6% против 4,2%. Причина — требование
# «заполни обе ячейки»: модель дописывает цитату там, где цифры нет. По критерию приёмки v8 отклоняется.
# v9 = v8 без этого требования, с прямым запретом выдумывать и с правилом «цитата — там, где стоит эта цифра».
# ПРЕДСКАЗАНИЕ (21:40, до прогона): у v9 выдуманных цитат не больше, чем у v7 (4,2%), а плавающих числовых
# клеток не больше, чем у v8 (4). Если выдумки останутся высокими — дело не в требовании, а в самих ячейках,
# и тогда правило про капитал надо переносить обратно в v7.
# Круги: v9 → v8 (добор до 8) → v7 (добор до 12, контроль в том же окне времени).

[[job]]
model = "qwen3.8-27b-mlx@4bit"
spec = "v9_extract"
reports = ["2022_q4", "2026_q2", "2024_q3", "2023_q4"]
runs = 8
temperature = 0.7
min_p = 0.05
mode = "extract2"
text = "v2"
ctx = 32768

