# Ночь 3 (16.09 18:30 → 17.09 08:30, 14 ч). Решения по итогам ночей 1–2 — _АНДРЕЙ/1_ночи/ночь_2.md.
# База для точечных проверок: v2_inplace (единственный вариант, прошедший критерий).
# Ячейка: 4 отладочных отчёта × 3 прогона, если не сказано иное. Qwen ≈ 5 мин/прогон, Gemma ≈ 9,5.
# Очередь идёт строго сверху вниз (раннер больше не группирует по моделям). Низ очереди может не успеть — это
# запас, чтобы Mac не простаивал; недоделанное дозапускается той же командой.

# ═══ 1. Решения о спеке (главное) ═══════════════════════════════════════════════

# 1.1 v3 = v2_inplace + смягчённое правило периода (не ставить ноль, если цифры за нужный период нет).
#     Сразу 5 прогонов: если v3 станет лидером, его не придётся перепроверять.       20 прогонов ≈ 1,8 ч
[[job]]
model = "qwen3.8-27b-mlx@4bit"
spec = "v3"
reports = ["2022_q4", "2026_q2", "2024_q3", "2023_q4"]
runs = 5
temperature = 0.7
ctx = 32768

