# Ночь 21→22.09 — последняя ночь гипотез перед заморозкой (финал — ночь 22→23).
#
# Итог дня (22:50): Яндекс 8B со схемой работает технически, но непригоден: альфа 0,745, выдуманных цитат 34%.
# Без строгой схемы ответ не разбирается вообще — 0 из 5 (и у Qwen, и у Яндекса): строгий JSON — жёсткое требование
# конвейера. Температура 0,3 подтвердилась на 9 прогонах: альфа 0,974 против 0,965, выдуманных 5,9% против 7,1%.
#
# N8 — главный кандидат на боевой режим: T=0, три разных порядка показателей (раннер даёт каждому прогону свою
#   перестановку), итог — большинство, расхождение — флажок «на проверку человеку».
# ПРЕДСКАЗАНИЕ (22:55, до прогона): (1) три перестановки расходятся в 2–4 клетках из 24 на отчёт;
#   (2) эти клетки на 80% и больше совпадают с плавающими при сэмплировании (T=0,7);
#   (3) мода трёх перестановок совпадает с эталоном не хуже одиночного прогона при T=0 (94%).
# N7 — контроль к 5 битам: 4 бита с тем же урезанным контекстом 20480. Если 4 бита при 20480 тоже хуже —
#   виноват контекст; если нет — виноваты веса (подгонка под 4-битную версию).

# N8: добор до трёх перестановок на всех отчётах, кроме холдаута
[[job]]
model = "qwen3.8-27b-mlx@4bit"
spec = "v7_extract"
reports = ["2023_q1", "2023_q3", "2024_q1", "2024_q2", "2025_q1", "2025_q2", "2025_q4", "2026_q1",
           "2022_q4", "2026_q2", "2024_q3", "2023_q4",
           "vtb_2026_q1", "tbank_2026_q2", "tbank_2026_q1", "tbank_2024_q4"]
runs = 3
temperature = 0
ids_order = "shuffled"
mode = "extract2"
text = "v2"
ctx = 32768

# N7: контроль к замеру 5 бит
[[job]]
model = "qwen3.8-27b-mlx@4bit"
spec = "v7_extract"
reports = ["2022_q4", "2026_q2", "2024_q3", "2023_q4"]
runs = 5
temperature = 0.7
min_p = 0.05
mode = "extract2"
text = "v2"
ctx = 20480
tag = "c20480"

# ══════ Разложение разброса: повтор × порядок (по 2608.16253, «Second-Order Response Laws») ══════
# Три фиксированных порядка показателей, по 2 повтора каждый при T=0,7. Вместе с 16 прогонами в исходном порядке
# это даёт несмещённое разложение: случайность вызова / порядок / взаимодействие — по каждой клетке.
# Зачем для записки: главная находка («ломаются одни и те же клетки») получает количественную форму —
# какая доля разброса от сэмплирования, какая от порядка, и одни ли это клетки.
# ПРЕДСКАЗАНИЕ (23:20): доля «случайности вызова» больше доли «порядка» (у Qwen в статье так же: .19 против .05).

[[job]]
model = "qwen3.8-27b-mlx@4bit"
spec = "v7_extract"
reports = ["2022_q4", "2026_q2", "2024_q3", "2023_q4"]
runs = 2
temperature = 0.7
min_p = 0.05
ids_order = "shuffled"
order_seed = 1
tag = "o1"
mode = "extract2"
text = "v2"
ctx = 32768

[[job]]
model = "qwen3.8-27b-mlx@4bit"
spec = "v7_extract"
reports = ["2022_q4", "2026_q2", "2024_q3", "2023_q4"]
runs = 2
temperature = 0.7
min_p = 0.05
ids_order = "shuffled"
order_seed = 2
tag = "o2"
mode = "extract2"
text = "v2"
ctx = 32768

[[job]]
model = "qwen3.8-27b-mlx@4bit"
spec = "v7_extract"
reports = ["2022_q4", "2026_q2", "2024_q3", "2023_q4"]
runs = 2
temperature = 0.7
min_p = 0.05
ids_order = "shuffled"
order_seed = 3
tag = "o3"
mode = "extract2"
text = "v2"
ctx = 32768

# ══════ Запас на утро: 4-я и 5-я перестановки при T=0 ══════
# Для решения о боевом режиме: хватает ли трёх перестановок, или пять ловят заметно больше хрупких клеток.
[[job]]
model = "qwen3.8-27b-mlx@4bit"
spec = "v7_extract"
reports = ["2023_q1", "2023_q3", "2024_q1", "2024_q2", "2025_q1", "2025_q2", "2025_q4", "2026_q1",
           "2022_q4", "2026_q2", "2024_q3", "2023_q4",
           "vtb_2026_q1", "tbank_2026_q2", "tbank_2026_q1", "tbank_2024_q4"]
runs = 5
temperature = 0
ids_order = "shuffled"
mode = "extract2"
text = "v2"
ctx = 32768
