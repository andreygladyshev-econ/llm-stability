# ФИНАЛЬНАЯ НОЧЬ 22→23.09 — две таблицы (v7 и v10) в боевом режиме, холдаут открывается здесь, один раз.
# Андрей 22.09: «можно две серии на две таблицы, утром выберем лучшую».
#
# Почему две: короткий дневной прогон (day22_short) v10 формально НЕ прошла (хрупких 2,50 против порога 2,33;
# выдуманных цитат 9,3% против 8,0%, z = 0,64 — шум). Разбор показал: лишние хрупкие — от ошибки «база прошлого
# квартала вместо прошлого года» на T-Банке, которая есть и у v7 (её перестановка 4), просто в срез из трёх
# перестановок у v7 она не попала. Три перестановки × 6 отчётов — мало, чтобы различить спеки.
#
# ПРАВИЛО ВЫБОРА УТРОМ (записано до прогона, 22.09 ~18:30), парное сравнение на одинаковых перестановках 1–5:
#   1. правильность: мода пяти перестановок против эталона на ВСЕХ размеченных отчётах (2026_q2, 2022_q4 +
#      холдаут, который Claude размечает вслепую этой ночью, до просмотра ответов). v10 должна быть не хуже v7
#      на холдауте — на 2026_q2 и 2022_q4 она «видела» решения Андрея, там сравнение нечестное в её пользу;
#   2. устойчивость: хрупких клеток на отчёт по 19 отчётам; v10 принимается, если разница v10 − v7 не больше
#      +0,5 (бутстрап по отчётам, верхняя граница 90%);
#   3. выдуманных цитат не больше, чем у v7, + 2 пп.
#   Всё выполнено → в записку идёт v10 (решения заказчика вписаны в спеку). Иначе — v7, а v10 как приложение.
#
# ПРЕДСКАЗАНИЯ: на холдауте хрупких не больше 2 на отчёт в боевом режиме; альфа при T=0,7 не ниже 0,92;
# контрольный повтор 2026_q2 байт в байт совпадёт с прогоном 21.09 (движок MLX не менялся).
# Порядок внутри задания: номер прогона → отчёт, поэтому при остановке в любой момент серии сбалансированы.
# ~122 прогона × ~7 мин ≈ 14 ч. Последние задания (T=0,7) — наименее важные, их может срезать срок.

# 0. Контроль дрейфа окружения: тот же запрос, что 2026_q2 run1 (перестановка 1) у v7 — ответ должен совпасть.
[[job]]
model = "qwen3.8-27b-mlx@4bit"
spec = "v7_extract"
reports = ["2026_q2"]
runs = 1
temperature = 0
ids_order = "shuffled"
mode = "extract2"
text = "v2"
ctx = 32768
tag = "sent1"

# 1. Таблица v7: холдаут, пять перестановок (остальные 12 отчётов Сбера уже посчитаны).
[[job]]
model = "qwen3.8-27b-mlx@4bit"
spec = "v7_extract"
reports = ["2023_q2", "2024_q4", "2025_q3"]
runs = 5
temperature = 0
ids_order = "shuffled"
mode = "extract2"
text = "v2"
ctx = 32768

# 2. Таблица v10: холдаут, пять перестановок — главное парное сравнение вне выборки.
[[job]]
model = "qwen3.8-27b-mlx@4bit"
spec = "v10_extract"
reports = ["2023_q2", "2024_q4", "2025_q3"]
runs = 5
temperature = 0
ids_order = "shuffled"
mode = "extract2"
text = "v2"
ctx = 32768

# 3. Таблица v10: остальные отчёты до пяти перестановок (6 дневных добираются перестановками 4–5).
[[job]]
model = "qwen3.8-27b-mlx@4bit"
spec = "v10_extract"
reports = ["2026_q2", "2022_q4", "2024_q3", "2023_q4", "vtb_2026_q1", "tbank_2026_q2",
           "2023_q1", "2023_q3", "2024_q1", "2024_q2", "2025_q1", "2025_q2", "2025_q4", "2026_q1",
           "tbank_2026_q1", "tbank_2024_q4"]
runs = 5
temperature = 0
ids_order = "shuffled"
mode = "extract2"
text = "v2"
ctx = 32768

# 4. Столбец «устойчивость при сэмплировании» для холдаута (у остальных 12 отчётов v7 он уже есть).
[[job]]
model = "qwen3.8-27b-mlx@4bit"
spec = "v7_extract"
reports = ["2023_q2", "2024_q4", "2025_q3"]
runs = 5
temperature = 0.7
min_p = 0.05
mode = "extract2"
text = "v2"
ctx = 32768

# 5. То же для v10 — наименее важное.
[[job]]
model = "qwen3.8-27b-mlx@4bit"
spec = "v10_extract"
reports = ["2023_q2", "2024_q4", "2025_q3"]
runs = 5
temperature = 0.7
min_p = 0.05
mode = "extract2"
text = "v2"
ctx = 32768

# 6. Контроль дрейфа в конце ночи.
[[job]]
model = "qwen3.8-27b-mlx@4bit"
spec = "v7_extract"
reports = ["2026_q2"]
runs = 1
temperature = 0
ids_order = "shuffled"
mode = "extract2"
text = "v2"
ctx = 32768
tag = "sent2"

# ═══ Дописано 22.09 ~22:20 (Андрей: «локальную модель можно гонять сколько угодно»). Начнётся само после основного.
# Раннер перечитывает очередь перед каждым прогоном, поэтому дозагрузка не требует перезапуска.

# 7. Холдаут при T=0,7 до 10 прогонов: предрегистрация порога отказа считает меру неуверенности по 10 прогонам,
#    у отладочных отчётов они есть, у холдаута было 5. Закрывает сертификат на 5 размеченных отчётах.
[[job]]
model = "qwen3.8-27b-mlx@4bit"
spec = "v7_extract"
reports = ["2023_q2", "2024_q4", "2025_q3"]
runs = 10
temperature = 0.7
min_p = 0.05
mode = "extract2"
text = "v2"
ctx = 32768

# 8. Обезличенные тексты («Банк А») в боевом режиме: держится ли хрупкость клеток, когда из отчёта убрано имя банка.
#    Четвёртый тип возмущения к сэмплированию, температуре и порядку показателей — проверка главного тезиса записки.
[[job]]
model = "qwen3.8-27b-mlx@4bit"
spec = "v7_extract"
reports = ["anon_2026_q2", "anon_2022_q4", "anon_2024_q3", "anon_2023_q4"]
runs = 5
temperature = 0
ids_order = "shuffled"
mode = "extract2"
text = "v2"
ctx = 32768

# 9. Перестановки 6–10 на отладочных отчётах: сколько прогонов боевого режима реально нужно заказчику —
#    растёт ли число хрупких клеток при переходе с 5 перестановок на 10 (на 3→5 прибавка была +0,3 клетки).
[[job]]
model = "qwen3.8-27b-mlx@4bit"
spec = "v7_extract"
reports = ["2026_q2", "2022_q4", "2024_q3", "2023_q4"]
runs = 10
temperature = 0
ids_order = "shuffled"
mode = "extract2"
text = "v2"
ctx = 32768
