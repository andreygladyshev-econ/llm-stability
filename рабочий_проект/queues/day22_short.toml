# Короткий дневной прогон 22.09 — единственный вопрос перед заморозкой: v10 или v7.
# v10 = v7 + решения Андрея 21.09 из реестра (один период без оговорок, название показателя буквально, таблица
# оценочных фраз, пороги качества портфеля, внешние условия год к году, тональность по всей речи председателя).
# Боевой режим: T=0, три перестановки порядка показателей (у v7 они уже посчитаны на тех же отчётах).
# Отчёты: 4 отладочных (из них 2 с эталоном: 2026_q2, 2022_q4) + 2 чужих банка — проверка, не сломали ли перенос.
#
# КРИТЕРИЙ (записан до прогона, 22.09): v10 принимается, если одновременно
#   1. мода трёх перестановок совпадает с эталоном не хуже v7 (v7: 46 из 48);
#   2. хрупких клеток на отчёт не больше, чем у v7 + 0,5 (v7 на этих 6 отчётах — считается скриптом);
#   3. выдуманных цитат не больше, чем у v7.
# Иначе замораживаем v7. ПРЕДСКАЗАНИЕ: v10 исправит 2 клетки эталона (тональность и средства клиентов 2026_q2)
# и не добавит хрупких.
[[job]]
model = "qwen3.8-27b-mlx@4bit"
spec = "v10_extract"
reports = ["2026_q2", "2022_q4", "2024_q3", "2023_q4", "vtb_2026_q1", "tbank_2026_q2"]
runs = 3
temperature = 0
ids_order = "shuffled"
mode = "extract2"
text = "v2"
ctx = 32768
