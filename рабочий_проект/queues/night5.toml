# Ночь 5 (18.09 ~23:20 → срок 19.09 20:00, ~20 ч работы). Андрей остановит сам, когда сочтёт нужным.
# Разбор ночи 4: _АНДРЕЙ/1_ночи/ночь_4.md. Разбор спеки 18.09: _АНДРЕЙ/3_знания/диагноз_спеки_v3.md.
#
# Как устроена очередь: РАУНД А — главное, заканчивается к ~09:00. РАУНД Б — добор точности и запасные
# проверки, идёт, пока Андрей не остановит. Внутри задания прогоны идут по кругу (прогон 1 по всем отчётам,
# потом прогон 2…) — при остановке в любой момент число прогонов по отчётам отличается максимум на один.
# Повтор задания с бо́льшим runs добирает прогоны: уже сделанные файлы пропускаются.
#
# База сравнения: v2_inplace, T=0.7, 4 отладочных отчёта, 10 прогонов (альфа 0,919).
# Главная метрика сравнения — альфа (порядковая, в журнале): сравнима при разном числе прогонов.
# Очередь перечитывается перед каждым прогоном: можно дописывать задания ночью.

# ══════════════════════════════ РАУНД А ══════════════════════════════

# ─── А1. H3: баллы считает Python (главный кандидат) ───────────────────────────
# Модель выписывает числа, период и цитату; пороги применяет src/score_rules.py (17 из 24 показателей).
# Ожидание (записано до прогона, диагноз v3): уходят провалы модели при ясном правиле — opex (не тот период,
# выдуманный доход), active_clients (арифметика у порога), capital_adequacy (порог). Это же измерение с ДРУГИМ
# механизмом ошибки — нужно для оценки правильности без эталона (L12).
[[job]]
model = "qwen3.8-27b-mlx@4bit"
spec = "v5_extract"
reports = ["2022_q4", "2026_q2", "2024_q3", "2023_q4"]
runs = 5
temperature = 0.7
mode = "extract"
ctx = 32768

# ─── А2. v6: исправлено противоречие в спеке (S1) ─────────────────────────────
# v6 = v2_inplace + два уточнения к оценочной фразе: знак фразы — по колонке «плюс — это»; фраза о другом
# периоде не перебивает квартальную цифру. Правка общего правила, не случая.
# Предсказание (до прогона): cir 2026_q2 перестаёт плавать и уходит в −1 (квартал +0,7 п.п.) минимум в 4 из 5;
# остальные показатели — без изменений в пределах шума. Если плывёт что-то ещё — правка задела лишнее.
[[job]]
model = "qwen3.8-27b-mlx@4bit"
spec = "v6"
reports = ["2022_q4", "2026_q2", "2024_q3", "2023_q4"]
runs = 5
temperature = 0.7
ctx = 32768

# ─── А3. H26: контрфакты — реагирует ли модель на подмену факта ───────────────
# Проверка правильности без эталона: факт подменён везде, где встречается, оценка обязана сдвинуться
# предсказуемо (ожидания — notes/counterfacts.json). cf_profit_down_partial — контроль (правка в одном месте).
[[job]]
model = "qwen3.8-27b-mlx@4bit"
spec = "v2_inplace"
reports = ["cf_profit_down", "cf_profit_down_partial", "cf_profit_small", "cf_roe_flat", "cf_cor_up",
           "cf_dividends_plain", "cf_capital_pressure", "cf_fee_down", "cf_funds_small", "cf_clients_big",
           "cf_nii_flat", "cf_opex_faster", "cf_tone_crisis", "cf_tone_calm"]
runs = 3
temperature = 0.7
ctx = 32768

# ─── А4. H3 в боевом режиме (T=0) ─────────────────────────────────────────────
[[job]]
model = "qwen3.8-27b-mlx@4bit"
spec = "v5_extract"
reports = ["2022_q4", "2026_q2", "2024_q3", "2023_q4"]
