# ══════════ ПЕРЕЗАПУСК 19.09 ~06:50: КОНТРОЛЬ СКРЫТОГО ПАРАМЕТРА min_p ══════════
# Что случилось: 18.09 LM Studio завёл «карточку» qwen/qwen3.8-27b со своими умолчаниями выборки, min_p в ней
# выключен. Мы min_p не задавали → при T=0.7 могла измениться случайность выборки (при T=0 — нет: проверка
# побайтового совпадения это не ловит). Все новые конфигурации раунда А плавают сильнее базы, в т.ч. там, где их
# правки ни при чём. Тест 19.09: LM Studio min_p слушает (T=2: без него мешанина, с 0.5 — осмысленные слова).
# Опыт: база v2_inplace T=0.7 на 4 отладочных отчётах — (К1) с явным min_p=0.05 и (К2) как сейчас, без min_p
# (прогоны 11–15). Сравнение с прогонами 1–5 и 6–10 прошлых ночей по альфе (записано до результата):
#   К2 ниже исторического диапазона больше чем на 0.03, а К1 внутри него → min_p объясняет разницу;
#   оба внутри → дело не в min_p; оба ниже → изменилось что-то ещё.
# Дальше все новые T=0.7-прогоны — отдельной серией с min_p=0.05: внутри неё всё сравнимо при любом исходе.
[[job]]
model = "qwen3.8-27b-mlx@4bit"
spec = "v2_inplace"
reports = ["2022_q4", "2026_q2", "2024_q3", "2023_q4"]
runs = 5
temperature = 0.7
min_p = 0.05
ctx = 32768

[[job]]
model = "qwen3.8-27b-mlx@4bit"
spec = "v2_inplace"
reports = ["2022_q4", "2026_q2", "2024_q3", "2023_q4"]
runs = 15
temperature = 0.7
ctx = 32768

# Повтор главных кандидатов раунда А в серии min_p=0.05 — сравнение с К1, а не с историей
