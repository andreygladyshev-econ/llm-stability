# 23.09 13:50: у DeepSeek на уровне high размышление 18–24 тыс. токенов, 5–7 мин на запрос, 2 из 3 ответов обрезаны
#    лимитом 24000 (отложены в raw_think_high/). Для вопроса «помогает ли думать» нужно включено/выключено, а не
#    предел: DeepSeek и Qwen — low, GLM Flash (у неё low уже был базой) — high, лимит поднят до 32000.
# ── Опыт 2. Помогает ли «думать»: те же 6 отчётов × 5 перестановок + повтор одного запроса ×5, размышление включено.
#    Три пары: DeepSeek (выкл → high), Qwen 27B — те же веса, что на ноутбуке (выкл → medium), GLM-5.3 Flash
#    (минимальное → high). Сравнение — с уже посчитанными сериями тех же моделей.
