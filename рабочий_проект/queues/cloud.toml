# ОБЛАКО — список утверждён Андреем 22.09.2026. Порядок заданий = порядок запуска.
# Запуск ТОЛЬКО по команде Андрея и ПО ОДНОЙ МОДЕЛИ:  .venv/bin/python src/cloud.py run queues/cloud.toml --only <модель>
# После каждой модели — разбор (src/cloud_report.py): деньги против прогноза, разбор ответов, провайдер, детерминизм.
# Спека v7 (заморожена по критерию 22.09; v10 — вторая таблица этой ночи).
# 22.09 вечером: в боевом режиме 2024_q3 и 2023_q4 (без эталона) заменены на холдаут 2024_q4 и 2025_q3 (эталон размечен
#   вслепую) — правильность открытых моделей видна на 4 размеченных отчётах вместо 2. Стоимость та же (длина текстов равна).
# Защита: лимит ключа $20 · общий стоп $18 · бюджет модели · худший запрос проверяется до отправки · logs/cloud.STOP.
# Полный протокол (55): детерминизм 5 одинаковых запросов (seed=1) · боевой режим 6 отчётов × 5 перестановок, T=0 ·
#   сэмплирование 4 отчёта × 5 при T=0,7.  Урезанный (9): детерминизм 3 · 2 эталонных отчёта × 3 перестановки.


