# ФИНАЛЬНЫЙ ЛОКАЛЬНЫЙ ПРОХОД — конвейер v10_extract заморожен (решение вечером 22.09 по итогам queues/day22.toml).
# Холдаут (2023_q2, 2024_q4, 2025_q3) открывается ЗДЕСЬ, один раз. После — никаких правок спеки и кода.
# Боевой режим: T=0, пять перестановок порядка показателей, итог по большинству, расхождения — флажок человеку.
# Столбец «устойчивость при сэмплировании» для таблицы задания: T=0,7 по 5 прогонов.
# ПРЕДСКАЗАНИЕ (22.09, до прогона): на холдауте хрупких клеток не больше 2 на отчёт в боевом режиме,
# альфа при T=0,7 не ниже 0,92 (как у нетронутых кварталов). Если хуже — это признак подгонки, пишем как есть.

[[job]]
model = "qwen3.8-27b-mlx@4bit"
spec = "v10_extract"
reports = ["2023_q2", "2024_q4", "2025_q3"]
runs = 5
temperature = 0
ids_order = "shuffled"
mode = "extract2"
text = "v2"
ctx = 32768

[[job]]
model = "qwen3.8-27b-mlx@4bit"
spec = "v10_extract"
reports = ["2023_q2", "2024_q4", "2025_q3"]
runs = 5
temperature = 0.7
min_p = 0.05
mode = "extract2"
text = "v2"
ctx = 32768

# только для v10: добор пяти перестановок на всех остальных отчётах (у v7 они уже посчитаны ночью 21→22.09)
[[job]]
model = "qwen3.8-27b-mlx@4bit"
spec = "v10_extract"
reports = ["2023_q1", "2023_q3", "2024_q1", "2024_q2", "2025_q1", "2025_q2", "2025_q4", "2026_q1",
           "2022_q4", "2026_q2", "2024_q3", "2023_q4",
           "vtb_2026_q1", "tbank_2026_q2", "tbank_2026_q1", "tbank_2024_q4"]
runs = 5
temperature = 0
ids_order = "shuffled"
mode = "extract2"
text = "v2"
ctx = 32768
